name: Build ForexSellBot v0.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/vxulu01/forexsellbot
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ForexSellBot"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.vxulu01.forexsellbot"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.vxulu01.forexsellbot"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="ForexSellBot"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.ForexSellBot">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.ForexSellBot" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/vxulu01/forexsellbot/MainActivity.kt <<'EOF'
          package com.vxulu01.forexsellbot

          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private fun label(text: String, size: Float = 16f): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = size
                      setTextColor(Color.WHITE)
                      setPadding(24, 18, 24, 18)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 24, 24, 24)
                      setBackgroundColor(Color.rgb(15, 20, 28))
                  }

                  val title = label("ForexSellBot", 28f)
                  title.gravity = Gravity.CENTER

                  val version = label("v0.2  •  SHORT-TERM SELL", 15f)
                  version.gravity = Gravity.CENTER

                  val demo = label("DEMO MODE — NO LIVE TRADING", 14f)
                  demo.gravity = Gravity.CENTER
                  demo.setTextColor(Color.YELLOW)

                  root.addView(title)
                  root.addView(version)
                  root.addView(demo)

                  root.addView(label("━━━━━━━━━━━━━━━━━━━━", 14f))

                  root.addView(label("PAIR", 13f))
                  root.addView(label("EUR/USD", 22f))

                  root.addView(label("TIMEFRAME", 13f))
                  root.addView(label("5 MINUTES", 20f))

                  root.addView(label("SIGNAL", 13f))
                  val signal = label("SELL", 32f)
                  signal.gravity = Gravity.CENTER
                  signal.setTextColor(Color.rgb(255, 90, 90))
                  root.addView(signal)

                  root.addView(label("SIGNAL STRENGTH     78%", 18f))
                  root.addView(label("━━━━━━━━━━━━━━━━━━━━", 14f))

                  root.addView(label("ENTRY ZONE", 13f))
                  root.addView(label("1.08420 – 1.08460", 20f))

                  root.addView(label("STOP LOSS", 13f))
                  root.addView(label("1.08540", 20f))

                  root.addView(label("TAKE PROFIT 1", 13f))
                  root.addView(label("1.08240", 20f))

                  root.addView(label("TAKE PROFIT 2", 13f))
                  root.addView(label("1.08080", 20f))

                  root.addView(label("RISK / REWARD     1 : 2.0", 18f))

                  root.addView(label("━━━━━━━━━━━━━━━━━━━━", 14f))
                  root.addView(label("Strategy status: DEMO / SIMULATION", 14f))

                  setContentView(root)
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForexSellBot-v0.2
          path: app/build/outputs/apk/debug/app-debug.apk