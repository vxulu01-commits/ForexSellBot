name: Build ForexSellBot v0.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/vxulu01/forexsellbot
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ForexSellBot"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.vxulu01.forexsellbot"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.vxulu01.forexsellbot"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "0.3"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="ForexSellBot"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.ForexSellBot">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.ForexSellBot"
                  parent="Theme.Material3.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/vxulu01/forexsellbot/MainActivity.kt <<'EOF'
          package com.vxulu01.forexsellbot

          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var signalText: TextView
              private lateinit var strengthText: TextView
              private lateinit var detailsText: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildScreen()
                  runAnalysis()
              }

              private fun buildScreen() {

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 50, 40, 40)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  val title = TextView(this).apply {
                      text = "ForexSellBot"
                      textSize = 30f
                      gravity = Gravity.CENTER
                  }

                  val version = TextView(this).apply {
                      text = "v0.3 • SHORT-TERM SELL"
                      textSize = 16f
                      gravity = Gravity.CENTER
                  }

                  val demo = TextView(this).apply {
                      text = "DEMO MODE — NO LIVE TRADING"
                      textSize = 15f
                      gravity = Gravity.CENTER
                  }

                  signalText = TextView(this).apply {
                      textSize = 32f
                      gravity = Gravity.CENTER
                      setPadding(0, 35, 0, 10)
                  }

                  strengthText = TextView(this).apply {
                      textSize = 19f
                      gravity = Gravity.CENTER
                  }

                  detailsText = TextView(this).apply {
                      textSize = 17f
                      setPadding(0, 30, 0, 30)
                  }

                  val refresh = Button(this).apply {
                      text = "REFRESH ANALYSIS"
                      setOnClickListener {
                          runAnalysis()
                      }
                  }

                  root.addView(title)
                  root.addView(version)
                  root.addView(demo)
                  root.addView(signalText)
                  root.addView(strengthText)
                  root.addView(detailsText)
                  root.addView(refresh)

                  setContentView(root)
              }

              private fun runAnalysis() {

                  // DEMO strategy engine.
                  // This version simulates technical-analysis scoring.
                  // It does NOT connect to a broker or execute trades.

                  val trendScore = 82
                  val momentumScore = 76
                  val rsiScore = 74
                  val resistanceScore = 80
                  val candleScore = 72

                  val total =
                      (trendScore +
                       momentumScore +
                       rsiScore +
                       resistanceScore +
                       candleScore) / 5

                  if (total >= 75) {

                      signalText.text = "SELL"
                      signalText.setTextColor(Color.rgb(190, 30, 30))

                      strengthText.text =
                          "Signal strength: $total%"

                      detailsText.text = """
                          PAIR: EUR/USD
                          TIMEFRAME: 5 MINUTES

                          Trend: Bearish
                          Momentum: Bearish
                          RSI: Overbought / turning down
                          Resistance: Rejection detected
                          Candle: Bearish confirmation

                          ENTRY ZONE
                          1.08420 – 1.08460

                          STOP LOSS
                          1.08540

                          TAKE PROFIT 1
                          1.08240

                          TAKE PROFIT 2
                          1.08080

                          RISK / REWARD
                          Approximately 1 : 2.0

                          STRATEGY STATUS
                          DEMO / SIMULATION
                      """.trimIndent()

                  } else {

                      signalText.text = "WAIT"
                      signalText.setTextColor(Color.DKGRAY)

                      strengthText.text =
                          "Signal strength: $total%"

                      detailsText.text = """
                          PAIR: EUR/USD
                          TIMEFRAME: 5 MINUTES

                          Conditions are not strong
                          enough for a short-term sell.

                          STRATEGY STATUS
                          DEMO / SIMULATION
                      """.trimIndent()
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForexSellBot-v0.3
          path: app/build/outputs/apk/debug/app-debug.apk
