name: Build ForexSellBot v0.4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/vxulu01/forexsellbot
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ForexSellBot"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.vxulu01.forexsellbot"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.vxulu01.forexsellbot"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 4
                  versionName = "0.4"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="ForexSellBot"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.ForexSellBot">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.ForexSellBot"
                  parent="Theme.Material3.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/vxulu01/forexsellbot/MainActivity.kt <<'EOF'
          package com.vxulu01.forexsellbot

          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          class MainActivity : AppCompatActivity() {

              private lateinit var signalText: TextView
              private lateinit var strengthText: TextView
              private lateinit var detailsText: TextView
              private lateinit var statusText: TextView
              private lateinit var refreshButton: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildScreen()
                  runAnalysis()
              }

              private fun buildScreen() {

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 45, 32, 35)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  val title = TextView(this).apply {
                      text = "ForexSellBot"
                      textSize = 30f
                      gravity = Gravity.CENTER
                  }

                  val version = TextView(this).apply {
                      text = "v0.4 • LIVE MARKET ANALYSIS"
                      textSize = 16f
                      gravity = Gravity.CENTER
                  }

                  statusText = TextView(this).apply {
                      text = "Connecting to market data..."
                      textSize = 15f
                      gravity = Gravity.CENTER
                      setPadding(0, 15, 0, 10)
                  }

                  signalText = TextView(this).apply {
                      text = "..."
                      textSize = 34f
                      gravity = Gravity.CENTER
                      setPadding(0, 25, 0, 8)
                  }

                  strengthText = TextView(this).apply {
                      textSize = 19f
                      gravity = Gravity.CENTER
                  }

                  detailsText = TextView(this).apply {
                      textSize = 16f
                      setPadding(0, 25, 0, 25)
                  }

                  refreshButton = Button(this).apply {
                      text = "REFRESH MARKET DATA"
                      setOnClickListener {
                          runAnalysis()
                      }
                  }

                  root.addView(title)
                  root.addView(version)
                  root.addView(statusText)
                  root.addView(signalText)
                  root.addView(strengthText)
                  root.addView(detailsText)
                  root.addView(refreshButton)

                  setContentView(root)
              }

              private fun runAnalysis() {

                  refreshButton.isEnabled = false
                  statusText.text = "Downloading EUR/USD 5-minute candles..."
                  signalText.text = "..."
                  strengthText.text = ""
                  detailsText.text = ""

                  Thread {

                      try {

                          val closes = downloadPrices()

                          if (closes.size < 50) {
                              throw Exception("Not enough market candles received.")
                          }

                          val result = calculateStrategy(closes)

                          runOnUiThread {
                              showResult(result)
                          }

                      } catch (e: Exception) {

                          runOnUiThread {

                              statusText.text = "Market data unavailable"

                              signalText.text = "WAIT"
                              signalText.setTextColor(Color.DKGRAY)

                              strengthText.text = "No reliable signal"

                              detailsText.text = """
                                  EUR/USD
                                  5-MINUTE TIMEFRAME

                                  The app could not obtain enough
                                  live market candles.

                                  Check your internet connection
                                  and press REFRESH MARKET DATA.

                                  No trade signal is generated
                                  when market data is unavailable.

                                  DEMO / SIMULATION
                              """.trimIndent()

                              refreshButton.isEnabled = true
                          }
                      }

                  }.start()
              }

              private fun downloadPrices(): List<Double> {

                  val url = URL(
                      "https://query1.finance.yahoo.com/v8/finance/chart/EURUSD=X" +
                      "?interval=5m&range=1d"
                  )

                  val connection =
                      url.openConnection() as HttpURLConnection

                  connection.requestMethod = "GET"
                  connection.connectTimeout = 10000
                  connection.readTimeout = 10000
                  connection.setRequestProperty(
                      "User-Agent",
                      "Mozilla/5.0"
                  )

                  try {

                      if (connection.responseCode != 200) {
                          throw Exception(
                              "HTTP ${connection.responseCode}"
                          )
                      }

                      val response =
                          connection.inputStream
                              .bufferedReader()
                              .use { it.readText() }

                      val root = JSONObject(response)

                      val result =
                          root.getJSONObject("chart")
                              .getJSONArray("result")
                              .getJSONObject(0)

                      val quote =
                          result.getJSONObject("indicators")
                              .getJSONArray("quote")
                              .getJSONObject(0)

                      val closes = quote.getJSONArray("close")

                      val prices = mutableListOf<Double>()

                      for (i in 0 until closes.length()) {

                          if (!closes.isNull(i)) {
                              val value = closes.getDouble(i)

                              if (value.isFinite() && value > 0) {
                                  prices.add(value)
                              }
                          }
                      }

                      return prices

                  } finally {
                      connection.disconnect()
                  }
              }

              private data class StrategyResult(
                  val signal: String,
                  val strength: Int,
                  val price: Double,
                  val emaFast: Double,
                  val emaSlow: Double,
                  val rsi: Double,
                  val macd: Double,
                  val resistance: Double,
                  val entryLow: Double,
                  val entryHigh: Double,
                  val stopLoss: Double,
                  val takeProfit1: Double,
                  val takeProfit2: Double
              )

              private fun calculateStrategy(
                  prices: List<Double>
              ): StrategyResult {

                  val price = prices.last()

                  val ema9 = ema(prices, 9)
                  val ema21 = ema(prices, 21)

                  val rsi = calculateRsi(prices, 14)

                  val ema12 = ema(prices, 12)
                  val ema26 = ema(prices, 26)

                  val macd = ema12 - ema26

                  val recentStart =
                      max(0, prices.size - 20)

                  val recent =
                      prices.subList(recentStart, prices.size)

                  val resistance =
                      recent.maxOrNull() ?: price

                  var score = 0

                  // Trend
                  if (ema9 < ema21) {
                      score += 25
                  }

                  // Momentum
                  if (macd < 0) {
                      score += 20
                  }

                  // RSI
                  if (rsi >= 50 && rsi <= 70) {
                      score += 15
                  } else if (rsi > 70) {
                      score += 20
                  }

                  // Price near resistance
                  val distance =
                      abs(resistance - price) / price

                  if (distance < 0.0025) {
                      score += 20
                  }

                  // Recent bearish movement
                  if (prices.size >= 4) {

                      val previous =
                          prices[prices.size - 4]

                      if (price < previous) {
                          score += 20
                      }
                  }

                  score = min(100, score)

                  val sell =
                      score >= 65 &&
                      ema9 < ema21 &&
                      macd < 0

                  val entryLow =
                      price * 0.9995

                  val entryHigh =
                      price * 1.0005

                  val riskDistance =
                      max(
                          price * 0.0015,
                          abs(resistance - price) * 0.8
                      )

                  val stopLoss =
                      price + riskDistance

                  val takeProfit1 =
                      price - riskDistance * 1.5

                  val takeProfit2 =
                      price - riskDistance * 2.0

                  return StrategyResult(
                      signal =
                          if (sell) "SELL" else "WAIT",
                      strength = score,
                      price = price,
                      emaFast = ema9,
                      emaSlow = ema21,
                      rsi = rsi,
                      macd = macd,
                      resistance = resistance,
                      entryLow = entryLow,
                      entryHigh = entryHigh,
                      stopLoss = stopLoss,
                      takeProfit1 = takeProfit1,
                      takeProfit2 = takeProfit2
                  )
              }

              private fun ema(
                  prices: List<Double>,
                  period: Int
              ): Double {

                  if (prices.size < period) {
                      return prices.last()
                  }

                  val multiplier =
                      2.0 / (period + 1)

                  var value = prices
                      .take(period)
                      .average()

                  for (i in period until prices.size) {

                      value =
                          ((prices[i] - value) * multiplier) +
                          value
                  }

                  return value
              }

              private fun calculateRsi(
                  prices: List<Double>,
                  period: Int
              ): Double {

                  if (prices.size <= period) {
                      return 50.0
                  }

                  var gains = 0.0
                  var losses = 0.0

                  for (i in 1..period) {

                      val change =
                          prices[i] - prices[i - 1]

                      if (change >= 0) {
                          gains += change
                      } else {
                          losses += abs(change)
                      }
                  }

                  var averageGain =
                      gains / period

                  var averageLoss =
                      losses / period

                  for (i in period + 1 until prices.size) {

                      val change =
                          prices[i] - prices[i - 1]

                      val gain =
                          max(change, 0.0)

                      val loss =
                          max(-change, 0.0)

                      averageGain =
                          ((averageGain * (period - 1)) + gain) /
                          period

                      averageLoss =
                          ((averageLoss * (period - 1)) + loss) /
                          period
                  }

                  if (averageLoss == 0.0) {
                      return 100.0
                  }

                  val rs =
                      averageGain / averageLoss

                  return 100.0 - (100.0 / (1.0 + rs))
              }

              private fun showResult(
                  result: StrategyResult
              ) {

                  statusText.text =
                      "LIVE MARKET DATA • EUR/USD • 5 MIN"

                  signalText.text =
                      result.signal

                  signalText.setTextColor(
                      if (result.signal == "SELL")
                          Color.rgb(190, 30, 30)
                      else
                          Color.DKGRAY
                  )

                  strengthText.text =
                      "Signal strength: ${result.strength}%"

                  val signalMessage =
                      if (result.signal == "SELL") {
                          "SHORT-TERM SELL CONDITIONS DETECTED"
                      } else {
                          "WAIT — SELL CONDITIONS NOT STRONG ENOUGH"
                      }

                  detailsText.text = """
                      $signalMessage

                      CURRENT PRICE
                      ${format(result.price)}

                      EMA 9
                      ${format(result.emaFast)}

                      EMA 21
                      ${format(result.emaSlow)}

                      RSI (14)
                      ${format(result.rsi)}

                      MACD
                      ${format(result.macd)}

                      RECENT RESISTANCE
                      ${format(result.resistance)}

                      ENTRY ZONE
                      ${format(result.entryLow)} – ${format(result.entryHigh)}

                      STOP LOSS
                      ${format(result.stopLoss)}

                      TAKE PROFIT 1
                      ${format(result.takeProfit1)}

                      TAKE PROFIT 2
                      ${format(result.takeProfit2)}

                      STRATEGY STATUS
                      LIVE DATA / SIMULATION

                      No automatic trade execution.
                  """.trimIndent()

                  refreshButton.isEnabled = true
              }

              private fun format(
                  value: Double
              ): String {
                  return String.format(
                      java.util.Locale.US,
                      "%.5f",
                      value
                  )
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForexSellBot-v0.4
          path: app/build/outputs/apk/debug/app-debug.apk
